name: Continuous Deployment (CD)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - apk
          - appbundle

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: flutter test

      - name: Configure Android Signing Keystore (Optional Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            
            if [ -n "$KEY_PROPERTIES" ]; then
              echo "$KEY_PROPERTIES" > android/key.properties
            elif [ -n "$KEY_ALIAS" ] && [ -n "$STORE_PASSWORD" ]; then
              printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
                "$STORE_PASSWORD" "${KEY_PASSWORD:-$STORE_PASSWORD}" "$KEY_ALIAS" > android/key.properties
            fi
            echo "Release keystore configured successfully."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found. Generating CI fallback signing keystore..."
            keytool -genkey -v -keystore android/app/ci-fallback-keystore.jks \
              -alias cikey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=CI Fallback, OU=KiranaPeople, O=Kirana, L=Jakarta, C=ID"
            
            printf "storePassword=android\nkeyPassword=android\nkeyAlias=cikey\nstoreFile=ci-fallback-keystore.jks\n" > android/key.properties
            echo "CI fallback keystore generated and configured successfully."
          fi

      - name: Build Universal APK
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'apk' || startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build apk --release

      - name: Build Split-per-ABI APKs
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'apk' || startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle (AAB for Google Play)
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'appbundle' || startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build appbundle --release

      - name: Stage Release Artifacts
        run: |
          mkdir -p release-artifacts
          if [ -d "build/app/outputs/flutter-apk" ]; then
            cp build/app/outputs/flutter-apk/*.apk release-artifacts/ 2>/dev/null || true
          fi
          if [ -d "build/app/outputs/bundle/release" ]; then
            cp build/app/outputs/bundle/release/*.aab release-artifacts/ 2>/dev/null || true
          fi
          ls -la release-artifacts/

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: android-release-binaries
          path: release-artifacts/*
          retention-days: 30

      - name: Create GitHub Release and Attach Binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}

